# Tag-triggered upstream release preparation (ADR 0025). A pushed
# vMAJOR.MINOR.PATCH tag whose commit is on main is verified, the product is
# tested on the exact tag, the deterministic source archive and SHA256SUMS are
# built and checked, the release's pkgrel 1 PKGBUILD is rendered for the
# archive's final public URL and validated in a fresh Arch container from the
# local archive, and a DRAFT GitHub Release is prepared with all three.
#
# This workflow never publishes the release and never sees AUR credentials. A
# maintainer reviews the draft's notes and assets and publishes it by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag and build assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: Verify the tag is a release tag contained in main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          version=$(bash scripts/release/verify-release-tag.sh "$TAG" origin/main)
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          [[ $(git rev-parse HEAD) == "$commit" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Test the exact tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          go mod download
          go test ./...
          go vet ./...
          go build -trimpath -o "$RUNNER_TEMP/omarchy-blueprint" \
            -ldflags "-X github.com/Grenco/omarchy-blueprint/internal/buildinfo.Version=${VERSION}" \
            ./cmd/omarchy-blueprint
          [[ $("$RUNNER_TEMP/omarchy-blueprint" --version) == "omarchy-blueprint version ${VERSION}" ]]
          python3 -m unittest discover -s scripts/release/tests -p 'test_*.py'
      - name: Build and verify the release assets
        env:
          COMMIT: ${{ steps.tag.outputs.commit }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          bash scripts/release/make-source-archive.sh "$COMMIT" "$VERSION" dist
          (cd dist && sha256sum --check --strict SHA256SUMS)
          outside=$(tar -tzf "dist/omarchy-blueprint-$VERSION.tar.gz" | grep -v "^omarchy-blueprint-$VERSION/" || true)
          [[ -z $outside ]] || { echo "archive entries outside omarchy-blueprint-$VERSION/: $outside"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Render and validate the release PKGBUILD
    needs: verify
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm --needed git go namcap python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist
      - name: Render the pkgrel 1 package for the public release URL
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          MAINTAINER_NAME: ${{ vars.AUR_MAINTAINER_NAME }}
          MAINTAINER_EMAIL: ${{ vars.AUR_MAINTAINER_EMAIL }}
        run: |
          # The URL fetch-release-source.sh constructs once the release is
          # public; AUR Publish re-renders from it and requires this file.
          python3 scripts/release/render-aur-package.py \
            --version "$VERSION" --pkgrel 1 \
            --source-url "https://github.com/$REPOSITORY/releases/download/$TAG/omarchy-blueprint-$VERSION.tar.gz" \
            --sha256 "$(cut -d' ' -f1 "$RUNNER_TEMP/dist/SHA256SUMS")" \
            --maintainer-name "$MAINTAINER_NAME" --maintainer-email "$MAINTAINER_EMAIL" \
            --output-dir "$RUNNER_TEMP/package"
          mkdir pkgbuild
          cp "$RUNNER_TEMP/package/PKGBUILD" pkgbuild/
          # The draft is not public yet: seed the verified archive so makepkg
          # builds it locally, still checking it against the pinned sha256.
          cp "$RUNNER_TEMP/dist/omarchy-blueprint-$VERSION.tar.gz" "$RUNNER_TEMP/package/"
      - name: Build, check, inspect and install the package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash scripts/release/validate-arch-package.sh "$RUNNER_TEMP/package" "$VERSION" 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pkgbuild
          path: pkgbuild/PKGBUILD
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Prepare draft GitHub Release
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-pkgbuild
          path: dist
      - name: Prepare the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          summary=$(bash scripts/release/prepare-draft-release.sh "$TAG" "$VERSION" "$COMMIT" dist)
          printf '%s\n' "$summary"
          {
            echo "## Draft release $TAG"
            echo
            printf '%s\n' "$summary"
            echo
            echo "Verified commit: $COMMIT"
            echo
            echo "A maintainer must review and edit the release notes and assets, then publish the draft by hand."
            echo "Publishing it starts final AUR package validation; this workflow never publishes anything."
          } >> "$GITHUB_STEP_SUMMARY"

name: Reconstruction Boot Soak

# Diagnostic only, never a merge gate: characterizes guest boot stalls by
# rebooting one pristine guest repeatedly. It performs no reconstruction, so
# it deliberately has its own workflow and check name, distinct from the
# reconstruction gate's.
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: reboot-cycles (one guest, warm/cold) or fresh-overlay (new overlay per trial, identity vs plain first reboot)
        type: choice
        options: [fresh-overlay, reboot-cycles]
        default: fresh-overlay
      count:
        description: Reboot cycles or overlay trials
        default: '30'
      boot_image:
        description: installer (as built by the official installer), rebuilt (regenerated on the installed system) or debug (regenerated with serial-console output)
        type: choice
        options: [installer, rebuilt, debug]
        default: installer

permissions:
  contents: read

concurrency:
  group: reconstruction-boot-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: Reconstruction Boot Soak
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Check soak scripts
        run: bash -n test/reconstruction/soak.sh test/reconstruction/lib/common.sh test/reconstruction/vm/*.sh
      - name: Install VM dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf genisoimage openssh-client
      - name: Prepare workspace
        run: sudo mkdir -p /mnt/omarchy-blueprint-ra && sudo chown "$USER:$USER" /mnt/omarchy-blueprint-ra
      - name: Soak guest boots
        run: bash test/reconstruction/soak.sh "$EXPERIMENT" "$COUNT" "$BOOT_IMAGE"
        env:
          EXPERIMENT: ${{ inputs.experiment }}
          COUNT: ${{ inputs.count }}
          BOOT_IMAGE: ${{ inputs.boot_image }}
      - name: Summarize
        if: always()
        run: cat /mnt/omarchy-blueprint-ra/artifacts/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconstruction-boot-soak-artifacts
          path: /mnt/omarchy-blueprint-ra/artifacts
          if-no-files-found: ignore

name: Reconstruction Assurance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      boot_soak:
        description: 'Diagnostic only: reboot cycles to run instead of the canonical lifecycle (0 = normal run)'
        default: '0'
      boot_debug:
        description: 'Diagnostic only: kernel and systemd output on the serial console'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reconstruction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconstruction:
    name: Reconstruction Assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Test reconstruction host helpers
        run: python3 -m unittest discover -s test/reconstruction/tests -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Check reconstruction scripts
        run: bash -n test/reconstruction/run.sh test/reconstruction/lib/common.sh test/reconstruction/vm/*.sh test/reconstruction/scenario/*.sh test/reconstruction/verify/*.sh
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install VM dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf genisoimage openssh-client
      - name: Build Blueprint
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/omarchy-blueprint-ra ./cmd/omarchy-blueprint
          sha256sum /tmp/omarchy-blueprint-ra | tee /tmp/omarchy-blueprint-ra.sha256
      - name: Prepare reconstruction workspace
        run: sudo mkdir -p /mnt/omarchy-blueprint-ra && sudo chown "$USER:$USER" /mnt/omarchy-blueprint-ra
      - name: Reconstruct the canonical machine
        run: bash test/reconstruction/run.sh
        env:
          RA_BOOT_SOAK: ${{ inputs.boot_soak || '0' }}
          RA_BOOT_DEBUG: ${{ inputs.boot_debug && '1' || '0' }}
      - name: Summarize
        if: always()
        run: cat /mnt/omarchy-blueprint-ra/artifacts/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # Always: successful runs' boot timings are the baseline for stall analysis.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconstruction-assurance-artifacts
          path: /mnt/omarchy-blueprint-ra/artifacts
          if-no-files-found: ignore
